# Facultatif : un vrai PostgreSQL pour ceux qui ont Docker. Sans lui, l'API utilise PGlite.
#   docker compose up -d
#   puis DATABASE_URL=postgres://joj:joj@localhost:5432/joj dans apps/api/.env
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: joj
      POSTGRES_PASSWORD: joj
      POSTGRES_DB: joj
    ports:
      # Port déjà pris sur votre machine : POSTGRES_PORT=5433 docker compose up -d (ou un .env
      # à la racine), et le même port dans DATABASE_URL.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U joj -d joj']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
